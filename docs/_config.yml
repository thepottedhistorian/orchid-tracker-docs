title: Orchid Tracker Documentation
description: Official documentation hub for the Botanical Archivist (Orchid Tracker)
theme: just-the-docs

# Where your docs live
source: docs

# Enable search
search_enabled: true

# Navigation + sidebar + header links
just_the_docs:
  collections:
    docs:
      name: Documentation
      nav_order: 1
  aux_links:
    "Orchid Tracker Docs":
      - https://thepottedhistorian.github.io/orchid-tracker-docs/

# Custom CSS
sass:
  style: compressed

plugins:
  - jekyll-sitemap

# Include custom CSS
include:
  - assets/css/custom.css

# Footer
footer_content: "© 2026 Orchid Tracker<br>Botanical Archivist Project<br>Documentation maintained by The Potted Historian"
